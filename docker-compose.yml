version: '3.8'

services:
  timer-service:
    build: ./backend/timer_service
    ports:
      - "8001:8001"
    networks:
      - pomodoro-net

  music-service:
    build: ./backend/music_service
    container_name: pomodoro_music_service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    volumes:
      # Persist SQLite database and uploaded audio files on your host machine
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    networks:
      - pomodoro-net
    restart: always

  orchestrator:
    build: ./backend/orchestrator
    ports:
      - "8000:8000"  # Main entry point for your frontend
    environment:
      - TIMER_SERVICE_URL=http://timer-service:8001
      - MUSIC_SERVICE_URL=http://music-service:8002 
    depends_on:
      - timer-service
      - music-service
    networks:
      - pomodoro-net

networks:
  pomodoro-net:
    driver: bridge